<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Where ComputeSDK sandbox providers run</title>
  <desc id="description">A comparison of ComputeSDK sandbox providers by execution location and isolation. Microsandbox appears as connected cloud and local points in the microVM row because the same provider and ComputeSDK API work in both places.</desc>

  <rect width="960" height="540" rx="16" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="15.5" fill="none" stroke="#d0d7de"/>

  <text x="48" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">Where ComputeSDK sandbox providers run</text>
  <text x="48" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#57606a">Microsandbox spans local and cloud without changing the sandbox API or isolation model.</text>

  <rect x="48" y="112" width="864" height="340" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M48 166 H912 M48 330 H912 M204 112 V452 M558 112 V452" fill="none" stroke="#d8dee4"/>

  <rect x="49" y="113" width="154" height="52" rx="11" fill="#f6f8fa"/>
  <rect x="205" y="113" width="352" height="52" fill="#f6f8fa"/>
  <path d="M559 113 H900 A11 11 0 0 1 911 124 V165 H559 Z" fill="#f6f8fa"/>

  <text x="68" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#57606a">ISOLATION</text>
  <text x="381" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#57606a">RUNS IN PROVIDER CLOUD</text>
  <text x="735" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#57606a">RUNS ON YOUR MACHINE</text>

  <text x="68" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#57606a">HARDWARE-ISOLATED</text>
  <text x="68" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">microVM</text>

  <text x="558" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a7f37">microsandbox</text>
  <line x1="381" y1="214" x2="735" y2="214" stroke="#2da44e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="381" cy="214" r="12" fill="#ffffff" stroke="#2da44e" stroke-width="4"/>
  <circle cx="381" cy="214" r="5" fill="#2da44e"/>
  <circle cx="735" cy="214" r="12" fill="#ffffff" stroke="#2da44e" stroke-width="4"/>
  <circle cx="735" cy="214" r="5" fill="#2da44e"/>
  <text x="381" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a7f37">CLOUD BACKEND</text>
  <text x="558" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">same ComputeSDK API</text>
  <text x="735" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a7f37">LOCAL BACKEND</text>

  <circle cx="233" cy="276" r="5" fill="#8c959f"/>
  <text x="245" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">e2b</text>
  <circle cx="335" cy="276" r="5" fill="#8c959f"/>
  <text x="347" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">vercel</text>
  <circle cx="233" cy="309" r="5" fill="#8c959f"/>
  <text x="245" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">codesandbox</text>
  <circle cx="356" cy="309" r="5" fill="#8c959f"/>
  <text x="368" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">blaxel</text>

  <text x="68" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#57606a">CONTAINER /</text>
  <text x="68" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">host process</text>

  <circle cx="280" cy="374" r="5" fill="#8c959f"/>
  <text x="292" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">daytona</text>
  <circle cx="400" cy="374" r="5" fill="#8c959f"/>
  <text x="412" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">modal</text>

  <circle cx="650" cy="374" r="5" fill="#8c959f"/>
  <text x="662" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">docker</text>
  <circle cx="759" cy="374" r="5" fill="#8c959f"/>
  <text x="771" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">just-bash</text>

  <text x="480" y="489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Two locations, one provider.</text>
  <text x="480" y="513" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Choose the backend when the app starts; the ComputeSDK integration stays the same.</text>
</svg>
