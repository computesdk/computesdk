<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Where ComputeSDK sandbox providers run</title>
  <desc id="description">A comparison of ComputeSDK sandbox providers by execution location and isolation. E2B, Vercel, CodeSandbox, and Blaxel provide cloud microVMs. Docker and just-bash run locally without microVM isolation. Microsandbox is the only provider shown that runs the same microVM sandbox both locally and in the cloud.</desc>

  <rect width="960" height="540" rx="16" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="15.5" fill="none" stroke="#d0d7de"/>

  <text x="48" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">Where ComputeSDK sandbox providers run</text>
  <text x="48" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#57606a">Most run in one place. Microsandbox runs the same microVM sandbox locally and in the cloud.</text>

  <rect x="48" y="112" width="864" height="340" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M48 166 H912 M48 309 H912 M204 112 V452 M440 112 V452 M676 112 V452" fill="none" stroke="#d8dee4"/>

  <rect x="49" y="113" width="154" height="52" rx="11" fill="#f6f8fa"/>
  <rect x="205" y="113" width="234" height="52" fill="#f6f8fa"/>
  <rect x="441" y="113" width="234" height="52" fill="#f6f8fa"/>
  <path d="M677 113 H900 A11 11 0 0 1 911 124 V165 H677 Z" fill="#dafbe1"/>

  <text x="68" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#57606a">ISOLATION</text>
  <text x="322" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#57606a">PROVIDER CLOUD ONLY</text>
  <text x="558" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#57606a">YOUR MACHINE ONLY</text>
  <text x="794" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#1a7f37">LOCAL + CLOUD</text>

  <text x="68" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#57606a">HARDWARE-ISOLATED</text>
  <text x="68" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">microVM</text>

  <circle cx="228" cy="211" r="5" fill="#8c959f"/>
  <text x="240" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">e2b</text>
  <circle cx="328" cy="211" r="5" fill="#8c959f"/>
  <text x="340" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">vercel</text>
  <circle cx="228" cy="260" r="5" fill="#8c959f"/>
  <text x="240" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">codesandbox</text>
  <circle cx="345" cy="260" r="5" fill="#8c959f"/>
  <text x="357" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">blaxel</text>

  <text x="558" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#afb8c1">—</text>
  <text x="558" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">none shown</text>

  <rect x="688" y="178" width="212" height="119" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
  <line x1="733" y1="211" x2="855" y2="211" stroke="#2da44e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="733" cy="211" r="9" fill="#2da44e"/>
  <circle cx="855" cy="211" r="9" fill="#2da44e"/>
  <text x="733" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1a7f37">LOCAL</text>
  <text x="855" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1a7f37">CLOUD</text>
  <text x="794" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a7f37">microsandbox</text>
  <text x="794" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">same provider • same API</text>

  <text x="68" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#57606a">CONTAINER /</text>
  <text x="68" y="389" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">host process</text>

  <circle cx="252" cy="359" r="5" fill="#8c959f"/>
  <text x="264" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">daytona</text>
  <circle cx="252" cy="407" r="5" fill="#8c959f"/>
  <text x="264" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">modal</text>

  <circle cx="491" cy="359" r="5" fill="#8c959f"/>
  <text x="503" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">docker</text>
  <circle cx="491" cy="407" r="5" fill="#8c959f"/>
  <text x="503" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">just-bash</text>

  <text x="794" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#afb8c1">—</text>

  <text x="480" y="489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Develop against a local microVM. Run remotely on a hosted microVM.</text>
  <text x="480" y="513" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">The ComputeSDK integration stays the same; only the microsandbox backend changes.</text>
</svg>
