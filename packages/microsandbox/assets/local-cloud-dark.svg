<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Where ComputeSDK sandbox providers run</title>
  <desc id="description">A comparison of ComputeSDK sandbox providers by execution location and isolation. Microsandbox appears as connected cloud and local points in the microVM row because the same provider and ComputeSDK API work in both places.</desc>

  <rect width="960" height="540" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="15.5" fill="none" stroke="#30363d"/>

  <text x="48" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f6fc">Where ComputeSDK sandbox providers run</text>
  <text x="48" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Microsandbox spans local and cloud without changing the sandbox API or isolation model.</text>

  <rect x="48" y="112" width="864" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M48 166 H912 M48 330 H912 M204 112 V452 M558 112 V452" fill="none" stroke="#30363d"/>

  <rect x="49" y="113" width="154" height="52" rx="11" fill="#0d1117"/>
  <rect x="205" y="113" width="352" height="52" fill="#0d1117"/>
  <path d="M559 113 H900 A11 11 0 0 1 911 124 V165 H559 Z" fill="#0d1117"/>

  <text x="68" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#8b949e">ISOLATION</text>
  <text x="381" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#8b949e">RUNS IN PROVIDER CLOUD</text>
  <text x="735" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#8b949e">RUNS ON YOUR MACHINE</text>

  <text x="68" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#8b949e">HARDWARE-ISOLATED</text>
  <text x="68" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">microVM</text>

  <circle cx="233" cy="207" r="5" fill="#6e7681"/>
  <text x="245" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">e2b</text>
  <circle cx="335" cy="207" r="5" fill="#6e7681"/>
  <text x="347" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">vercel</text>
  <circle cx="233" cy="248" r="5" fill="#6e7681"/>
  <text x="245" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">codesandbox</text>
  <circle cx="356" cy="248" r="5" fill="#6e7681"/>
  <text x="368" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">blaxel</text>

  <line x1="473" y1="287" x2="797" y2="287" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
  <circle cx="473" cy="287" r="12" fill="#161b22" stroke="#3fb950" stroke-width="4"/>
  <circle cx="473" cy="287" r="5" fill="#3fb950"/>
  <circle cx="797" cy="287" r="12" fill="#161b22" stroke="#3fb950" stroke-width="4"/>
  <circle cx="797" cy="287" r="5" fill="#3fb950"/>
  <rect x="548" y="271" width="174" height="32" rx="16" fill="#12261b"/>
  <text x="635" y="291" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#56d364">SAME PROVIDER • SAME API</text>
  <text x="473" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#56d364">microsandbox cloud</text>
  <text x="797" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#56d364">microsandbox local</text>

  <text x="68" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#8b949e">CONTAINER /</text>
  <text x="68" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">host process</text>

  <circle cx="280" cy="374" r="5" fill="#6e7681"/>
  <text x="292" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">daytona</text>
  <circle cx="400" cy="374" r="5" fill="#6e7681"/>
  <text x="412" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">modal</text>

  <circle cx="650" cy="374" r="5" fill="#6e7681"/>
  <text x="662" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">docker</text>
  <circle cx="759" cy="374" r="5" fill="#6e7681"/>
  <text x="771" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">just-bash</text>

  <text x="480" y="489" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Two locations, one provider.</text>
  <text x="480" y="513" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Choose the backend when the app starts; the ComputeSDK integration stays the same.</text>
</svg>
